l_english:

 ################################
 # ELEVATE A NOBLE FAMILY
 ################################
 
 ## Main Decision ##
 
 nfm_decision_elevate_nobles: "Elevate a Noble Family"
 nfm_decision_elevate_nobles_desc.preamble_feudal: "A well-maintained [ROOT.Char.GetGovernment.GetName] realm requires skilled families among the ranks of nobility. "
 nfm_decision_elevate_nobles_desc.preamble_admin: "A well-oiled administration requires skilled nobles. "
 nfm_decision_elevate_nobles_desc.main: "Among the families that serve under me, I find a lack of capable individuals.\n\nI shall send out a summons to the minor nobility that I am looking for suitable candidates"
 nfm_decision_elevate_nobles_desc.status_feudal: "to elevate in status to a proper [noble|E] [house|E] capable of receiving [titles|E]."
 nfm_decision_elevate_nobles_desc.status_admin: "to elevate in status to a proper [noble_family|E] capable of receiving [governorship|E] positions."
 nfm_decision_elevate_nobles_desc.end: "\n\nThe new family will have a specific [Concept('nfm_house_type', 'House Type')|E] and [Concept('nfm_family_size', 'Family Size')|E]."

 nfm_decision_elevate_nobles_desc.recently_founded_admin_cooldown: "#weak \n\n(Because you've recently founded your [ROOT.Char.GetGovernment.GetName] Government, the cooldown will only be #V [SCOPE.ScriptValue('nfm_value_elevate_nobles_cooldown_days')|0]#! days)#!"
 nfm_decision_elevate_nobles_tooltip: "A new [noble_family|E] will be created and elevated to serve in your court. The composition of the family will vary based on your needs."
 nfm_decision_elevate_nobles_confirm: "Send a Summons"
 # Cultural Titles
 nfm_decision_elevate_nobles_clan: "Elevate a Minor Clan"

 ## Family Size Tooltips ##
 nfm_decision_elevate_nobles_sizes_tt: "#S Family Size Chances are as follows:#!\n\t#F #E $EFFECT_LIST_BULLET$ #EMP 20%#!#!: $nfm_decision_elevate_nobles_small_tt$\n\t#E $EFFECT_LIST_BULLET$ #EMP 60%#!#!: $nfm_decision_elevate_nobles_medium_tt$\n\t#E $EFFECT_LIST_BULLET$ #EMP 20%#!#!: $nfm_decision_elevate_nobles_large_tt$\n#!"
 nfm_decision_elevate_nobles_small_tt: "A small family will be found, containing only the head and their children"
 nfm_decision_elevate_nobles_medium_tt: "A moderately sized family will be found, with some siblings and children"
 nfm_decision_elevate_nobles_large_tt: "A larger family will be found, with many siblings and children"

 nfm_decision_elevate_nobles_modifier_tt: "This [house|E] will gain a special [modifier|E] depending on their [nfm_house_type|E]"
 nfm_decision_elevate_nobles_getmerit_tt: "#weak Because of your [THIS.Char.GetGovernment.GetNameNoTooltip] Government:#! Members of the new family will be granted @merit_icon![merit|E] and have already passed some @provincial_exam_icon![examinations|E]"
 nfm_decision_elevate_nobles_tt: "A new [house|E] with a specific [nfm_house_type|E] will be generated"
 nfm_decision_elevate_nobles_tt.admin: "$nfm_decision_elevate_nobles_tt$ and granted a [noble_family|E] [title|E]"

 ################################
 # CHILDREN'S EXAMINATION AUTOMATION
 ################################

 nfm_decision_child_exam_automation: "Children's Examination Automation"
 nfm_decision_child_exam_automation_desc: "Not every child of my [house|E] needs direct micromanagement.\n\nSet the minimum pass chance required before eligible [extended_family|E] members are sent to a @child_exam_icon![childrens_examination|E] automatically on their 15th birthday. Any automated setting disables the vanilla reminder."
 nfm_decision_child_exam_automation_tooltip: "Choose the minimum expected pass chance required for automatic [childrens_examination|E] attempts on their 15th birthday."
 nfm_decision_child_exam_automation_confirm: "Set Automation"

 nfm_child_exam_auto_none: "Disable Automation"
 nfm_child_exam_auto_none_tooltip: "Use vanilla behavior. The reminder will be re-enabled"
 nfm_child_exam_auto_always: "No Requirements"
 nfm_child_exam_auto_always_tooltip: "Eligible [extended_family|E] members are sent to a [childrens_examination|E] automatically regardless of expected pass chance."
 nfm_child_exam_auto_25: "Require #V 25%#!"
 nfm_child_exam_auto_25_tooltip: "Eligible [extended_family|E] members are sent to a [childrens_examination|E] automatically if their expected pass chance is at least #V 25%#!."
 nfm_child_exam_auto_30: "Require #V 30%#!"
 nfm_child_exam_auto_30_tooltip: "Eligible [extended_family|E] members are sent to a [childrens_examination|E] automatically if their expected pass chance is at least #V 30%#!."
 nfm_child_exam_auto_50: "Require #V 50%#!"
 nfm_child_exam_auto_50_tooltip: "Eligible [extended_family|E] members are sent to a [childrens_examination|E] automatically if their expected pass chance is at least #V 50%#!."
 nfm_child_exam_auto_60: "Require #V 60%#!"
 nfm_child_exam_auto_60_tooltip: "Eligible [extended_family|E] members are sent to a [childrens_examination|E] automatically if their expected pass chance is at least #V 60%#!."
 nfm_child_exam_auto_70: "Require #V 70%#!"
 nfm_child_exam_auto_70_tooltip: "Eligible [extended_family|E] members are sent to a [childrens_examination|E] automatically if their expected pass chance is at least #V 70%#!."

 nfm_child_exam_automation_set_none_tt: "[childrens_examination|E] automation is #bold disabled#!. Vanilla reminders are enabled."
 nfm_child_exam_automation_set_always_tt: "[childrens_examination|E] automation runs for every eligible child. The vanilla reminder is disabled."
 nfm_child_exam_automation_set_25_tt: "[childrens_examination|E] automation requires at least #V 25%#! expected pass chance. The vanilla reminder is disabled."
 nfm_child_exam_automation_set_30_tt: "[childrens_examination|E] automation requires at least #V 30%#! expected pass chance. The vanilla reminder is disabled."
 nfm_child_exam_automation_set_50_tt: "[childrens_examination|E] automation requires at least #V 50%#! expected pass chance. The vanilla reminder is disabled."
 nfm_child_exam_automation_set_60_tt: "[childrens_examination|E] automation requires at least #V 60%#! expected pass chance. The vanilla reminder is disabled."
 nfm_child_exam_automation_set_70_tt: "[childrens_examination|E] automation requires at least #V 70%#! expected pass chance. The vanilla reminder is disabled."
 nfm_debug_child_exam_pass_chances_header: "NFM child exam pass chances for [THIS.Char.GetNameNoTooltip]"
 nfm_debug_child_exam_pass_chance_entry: "[THIS.Char.GetNameNoTooltip]: success weight [THIS.ScriptValue('nfm_value_child_exam_success_weight')|0], failure weight [THIS.ScriptValue('nfm_value_child_exam_failure_weight')|0], pass chance [THIS.ScriptValue('nfm_value_child_exam_pass_chance')|1]%"

 ################################
 # MISC
 ################################

 nfm_decision_toggle_debug: "#D (Debug)#! Unrestricted Decisions: [Select_CString(ROOT.Var('nfm_debug_enabled').IsSet, 'Disable', 'Enable')]"
 nfm_decision_toggle_debug_desc: "This decision will remove costs and restrictions from some NFM decisions for the current character."
 nfm_decision_toggle_debug_tooltip: "This decision will remove costs and restrictions from some NFM decisions for the current character."
 nfm_decision_toggle_debug_enable_tt: "#D Debug Mode will be #bold enabled#!#!"
 nfm_decision_toggle_debug_disable_tt: "#D Debug Mode will be #bold disabled#!#!"
 nfm_decision_toggle_debug_confirm: "Toggle Debug [Select_CString(ROOT.Var('nfm_debug_enabled').IsSet, 'Off', 'On')]"
 
