l_english:

 ################################
 # DECISIONS
 ################################

 ## Ban or Unban Dynasty from Cadet Branches
 nfm_cb_decision_toggledyncadetban: "Restrict [ROOT.Char.GetDynasty.GetNameNoTooltip] Cadet Branches"
 nfm_cb_decision_toggledyncadetban_disclaimer: "\n\n#help @warning_icon! Note that this feature may not work if you have any other mods that modify [cadet_branch|e] creation loaded after this one.#!"
 nfm_cb_decision_toggledyncadetban_desc: "There is no need for further needless divisions of our dynasty. $nfm_cb_decision_toggledyncadetban_disclaimer$"
 nfm_cb_decision_toggledyncadetban_confirm: "Restrict Cadet Branches"
 nfm_cb_decision_toggledyncadetban_tooltip: "[dynasty|E] members will no longer be allowed to create [cadet_branches|E] $nfm_cb_decision_toggledyncadetban_disclaimer$"
 nfm_cb_decision_toggledyncadetban_effect_tt: "#help As long as the [dynasty|E] has this [modifier|E], the [GetDecisionWithKey('create_cadet_branch_decision').GetName] [decision|E] cannot be taken until you take the #game_link Unrestrict Cadet Branches#! [decision|E].#!"

 nfm_cb_decision_toggledyncadetban_unban: "Unrestrict [ROOT.Char.GetDynasty.GetNameNoTooltip] Cadet Branches"
 nfm_cb_decision_toggledyncadetban_unban_desc: "Our dynasty should be free to create [cadet_branches|E] once more! $nfm_cb_decision_toggledyncadetban_disclaimer$"
 nfm_cb_decision_toggledyncadetban_unban_confirm: "Unrestrict Cadet Branches"
 nfm_cb_decision_toggledyncadetban_unban_tooltip: "[dynasty|E] members will be allowed to create [cadet_branches|E] again $nfm_cb_decision_toggledyncadetban_disclaimer$"
 nfm_cb_decision_toggledyncadetban_unban_effect_tt: "#help Members of the [dynasty|E] will be able to take the [GetDecisionWithKey('create_cadet_branch_decision').GetName] [decision|E] once more.#!"
 

 ## For the Vanilla Create Branch
 #nfm_loc_cadet_branches_banned_dynasty: "The [CHARACTER.GetDynasty.GetBaseName] [dynasty|E] has banned creating any more [cadet_branches|E]"
 nfm_loc_cadet_branches_banned_dynasty_not: "The [CHARACTER.GetDynasty.GetBaseName] [dynasty|E] has not banned creating any more [cadet_branches|E]"
 #nfm_loc_cadet_branches_banned_house: "[house|E] [CHARACTER.GetHouse.GetBaseName] is barred from creating [cadet_branches|E]"
 nfm_loc_cadet_branches_banned_house_not: "[house|E] [CHARACTER.GetHouse.GetBaseName] is not barred from creating [cadet_branches|E]" 

 ################################
 # INTERACTIONS
 ################################

 ## Ban or Unban Character's House from Cadet Branches
 nfm_cb_int_ban_house: "Forbid House Branching"
 nfm_cb_int_ban_house_desc: "There is no need for further divisions of the [recipient.GetDynastyHouseNameNoTooltip]."
 nfm_cb_int_unban_house: "Restore [recipient.GetDynastyHouseNameNoTooltip] Cadet Branch Rights"
 nfm_cb_int_unban_house_desc: "The [recipient.GetDynastyHouseNameNoTooltip] should be free to create [cadet_branches|E] once more!"

 ################################
 # MODIFIERS
 ################################

 nfm_cb_modifier_forbidcadetbranches_dynasty: "Dynastic Unity Enforced"
 nfm_cb_modifier_forbidcadetbranches_dynasty_desc: "This [dynasty|E] has banned the creation of any further [cadet_branches|E] without express permission from the [dynast|E]"
 nfm_cb_modifier_forbidcadetbranches_house: "House Unity Enforced"
 nfm_cb_modifier_forbidcadetbranches_house_desc: "The members of this [house|E] are no longer allowed to create [cadet_branches|E], each must don the arms of the House unless they have permission from the [dynast|E]."
 